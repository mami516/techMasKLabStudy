<!DOCTYPE HTML>
<html lang="ja">
<head>
<meta charset="UTF-8" />
  <title>JavaScriptBasic</title>
</head>
<body>
  <p>JavaScript　Basic</p>

  <script>

    /* 注：暗黙の数値変換 */
    /* 文字列を数値演算すると暗黙に数値型に変換されます */
    console.log( '1' + 2 ); // "12"
    console.log( '1' + '2' ); // "12"
    console.log( "1" + "2" ); // "12"
    console.log( 2 + '1' ); // "21"
    console.log( 2 + 2 + '1' ); // "41"
    console.log( 6 - '2' ); // 4
    console.log( 1 + 2 ); // 3
    console.log( 6 - "2" ); // 4


    /* いろいろな計算方法 */
    let a, b, c;
    a = b = c = 2 + 2;
    console.log( a ); // 4
    console.log( b ); // 4
    console.log( c ); // 4

    let n = 2;
    n = n + 5;
    console.log(n);
    n = n * 2;
    console.log(n,"最終結果！");

    let n2 = 2;
    n2 += 5;
    console.log(n2);
    n2 *= 2;
    console.log(n2, "結果はあっていますか？");


    /* インクリメント/デクリメント */
    /* これらの違いを確認しよう。 */
    /* なぜそうなるかを考えてみましょう。 */

    let counter = 2;
    counter++;
    console.log( counter );

    let counter2 = 2;
    ++counter2;
    console.log( counter2 );

    let counter3 = 2;
    counter3--;
    console.log( counter3 );

    let counter4 = 2;
    --counter4;
    console.log( counter4 );

  </script>
</body>
</html>
