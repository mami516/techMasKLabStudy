<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>index_j_5</title>
</head>
<body>

<script>
  alert("5を関数で確認します");

  // ① 4以上か確認する関数
  function checkFour(value) {
    if (value >= 4) {
      console.log("値は4以上です。");
    } else {
      console.log("値は4未満です。");
    }
  }

  // ② 10以上か確認する関数
  function checkTen(value) {
    if (value >= 10) {
      console.log("値は10以上です。");
    } else {
      console.log("値は10未満です。");
    }
  }

  // ③ 数値5を入力
  let number = 5;

  // ④ 2つの関数を使って表示
  checkFour(number);
  checkTen(number);
</script>

</body>
</html>
