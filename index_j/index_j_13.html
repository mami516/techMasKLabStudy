<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>J-13</title>
</head>
<body>

  <button id="change">変更</button>
  <button id="reset">リセット</button>

  <ul class="list-group">
    <li class="list-group-item">100</li>
    <li class="list-group-item">110</li>
    <li class="list-group-item">120</li>
    <li class="list-group-item">130</li>
    <li class="list-group-item">140</li>
  </ul>

<script>
// ul要素を取得
var list = document.querySelector('.list-group');

// ul要素の子要素であるli要素を取得
var listItems = list.querySelectorAll('li');

// 初期値を格納する配列を定義
var initialValues = [];

// 各li要素の初期値を取得して配列に格納
listItems.forEach(function(li) {
  initialValues.push(parseInt(li.textContent));
});

// 変更ボタン
document.getElementById('change').addEventListener('click', function() {
  // liの要素を取得
  var listItems = document.querySelectorAll('.list-group-item');

  // 要素の長さを取得してfor文でまわす
  for (var i = 0; i < listItems.length; i++) {

    // liの要素の値を取得して10を乗算
    var value = parseInt(listItems[i].textContent);
    listItems[i].textContent = value * 10;
  }
});

// リセットボタン
document.getElementById('reset').addEventListener('click', function() {

  // liの要素を取得
  var listItems = document.querySelectorAll('.list-group-item');

  // 初期値を配列から戻す
  listItems.forEach(function(item, index) {
    item.textContent = initialValues[index];
  });
});

</script>

</body>
</html>
